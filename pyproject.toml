[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aocore"
dynamic = ["version"]
description = "Shared conventions, conformance checks and optics primitives for the AO simulation stack."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Taylor", email = "jacobataylor7@gmail.com" }]
keywords = ["adaptive-optics", "optics", "conventions", "fourier-optics", "gpu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.23", "scipy>=1.10", "threadpoolctl>=3.0"]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x[ctk]>=13.0"]
cuda13 = ["cupy-cuda13x[ctk]>=13.6"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]
dev = ["build>=1.0", "mypy>=1.8", "pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/jacotay7/aocore"
Repository = "https://github.com/jacotay7/aocore"
Issues = "https://github.com/jacotay7/aocore/issues"
Changelog = "https://github.com/jacotay7/aocore/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/aocore/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aocore"]

[tool.hatch.build.targets.sdist]
include = ["src/aocore", "tests", "docs", "README.md", "CONVENTIONS.md", "AGENTS.md", "LICENSE", "CHANGELOG.md", "mkdocs.yml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "NPY"]
ignore = ["B905", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["aocore"]

[tool.mypy]
python_version = "3.10"
files = ["src/aocore"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["cupy.*", "cupyx.*", "scipy.*", "threadpoolctl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["gpu: CuPy/CUDA tests; run with --run-gpu"]

[tool.coverage.run]
source = ["aocore"]
branch = true
